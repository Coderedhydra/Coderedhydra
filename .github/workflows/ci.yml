# .github/workflows/ci.yml
name: Jules CI

on:
  push:
    branches: [ main ] # Or your default branch
  pull_request:
    branches: [ main ] # Or your default branch

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.21.x'] # Specify Go versions to test with
        node-version: ['20.x'] # Specify Node versions for UI build/test
        python-version: ['3.9'] # Specify Python versions for CLI tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: jules/ui/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # cache: 'pip' # If requirements.txt is added
        # cache-dependency-path: jules/cli/requirements.txt

    - name: Install Go dependencies
      run: cd jules/core && go mod download

    - name: Run Go tests
      run: cd jules/core && go test -v ./...

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest # Install pytest directly for now
        # If/when jules/cli/requirements.txt is added:
        # pip install -r jules/cli/requirements.txt

    - name: Run Python CLI tests
      run: pytest jules/cli/test_cli.py

    - name: Install Node.js UI dependencies
      run: cd jules/ui && npm ci # Use ci for cleaner installs in CI

    - name: Build React UI (test the build process)
      run: cd jules/ui && npm run build

    # Placeholder for UI tests (e.g., using Jest, Cypress, Playwright)
    # - name: Run UI tests
    #   run: cd jules/ui && npm test

    # Placeholder for integration tests using run.sh
    # - name: Run integration tests (example)
    #   run: ./jules/run.sh --target http://localhost:someport --action scan --scan-type xss
    #   # This would require a test server or a mock application to run against.
