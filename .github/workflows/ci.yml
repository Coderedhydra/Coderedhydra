# .github/workflows/ci.yml
name: Jules CI

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ] 

jobs:
  test:
    name: Run Tests and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.21.x'] 
        node-version: ['20.x'] 
        python-version: ['3.11'] # Standardize on a newer Python

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: jules/ui/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          jules/cli/requirements.txt
          jules/llm/requirements.txt

    - name: Install Go dependencies for all modules
      run: |
        cd jules/core && go mod tidy && go mod download
        cd ../llm && go mod tidy && go mod download
        cd ../kb && go mod tidy && go mod download
        cd ../.. # Back to root

    - name: Run Go tests for all modules
      run: |
        cd jules/core && go test -v ./...
        cd ../llm && go test -v ./...
        cd ../kb && go test -v ./...
        cd ../..

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest # For CLI tests
        if [ -f jules/cli/requirements.txt ]; then pip install -r jules/cli/requirements.txt; fi
        # LLM requirements might be heavy or have specific setup, install conditionally or mock them for CI
        if [ -f jules/llm/requirements.txt ] && [ -s jules/llm/requirements.txt ]; then 
          echo "Installing LLM Python requirements (may take time)..."
          # pip install -r jules/llm/requirements.txt
          echo "Skipping LLM Python requirements installation in CI for now (placeholders)."
        else
          echo "No LLM Python requirements to install or file is empty."
        fi

    - name: Run Python CLI tests
      run: pytest jules/cli/test_cli.py # Ensure tests are adapted for current CLI structure

    - name: Install Node.js UI dependencies
      run: cd jules/ui && npm ci 

    - name: Build React UI (test the build process)
      run: cd jules/ui && npm run build

    - name: Check for LLM Model and KB Data (Placeholder Check)
      run: |
        echo "Checking for placeholder LLM model and KB data directories..."
        if [ ! -d "models/qwen3-8b-awq" ]; then 
          echo "Placeholder 'models/qwen3-8b-awq' directory not found. This is a reminder for users to set it up."
          # mkdir -p models/qwen3-8b-awq # Create for CI pass, but doesn't mean model is there
        fi
        if [ ! -d "jules/kb/data" ]; then
          echo "Placeholder 'jules/kb/data' directory not found!"
          # mkdir -p jules/kb/data 
        fi
        # A real check might ensure some dummy file exists if data isn't committed.
        echo "Placeholder checks complete. Actual data/model presence is a runtime concern for users."

    # Placeholder for UI tests (e.g., using Jest, Cypress, Playwright)
    # - name: Run UI tests
    #   run: cd jules/ui && npm test

    # Placeholder for integration tests using run.sh (would need a target app)
    # - name: Run integration tests (example)
    #   run: ./jules/run.sh --target http://localhost:some-test-app --action scan --scan-type xss
